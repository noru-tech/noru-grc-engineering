# Fixture: a two-control audit pack for one framework over one half-year window. Exit 0.
#
# What each part is here to show:
#   * the change-management workpaper draws a REPRODUCIBLE sample. The seed is the population file's
#     own digest, so anybody holding that file can order it by sha256(seed + "|" + reference) and get
#     exactly the 5 rows listed below. That is the difference between a sample and a list
#     somebody typed.
#   * everything it says it inspected is something the scan digested, at that digest — including
#     another piece's committed manifest, because a pack should say which reviewed inputs produced
#     what is in Noru rather than only what the register happens to say today.
#   * the access-review workpaper concludes DEFICIENT, with an owned exception and a short expiry. A
#     control you found broken is not something to sign off for a year.
#
# The digests and the drawn sample are computed from the real files in tests/fixture-repo, so this
# fixture is internally true rather than plausible-looking. The one exception is the review-signoff
# manifest: the fixture repository holds no other piece's manifest, so that digest is synthetic and
# says so here rather than looking like a file somebody could open.
#
# The control and evidence-item ids are in the reserved synthetic namespaces (zz-*, E-ZZ-*) that
# contract/README.md sets aside for fixtures. Real catalogue ids must never appear anywhere in this
# repository — that is contract requirement 9, and fixtures are the obvious loophole.
