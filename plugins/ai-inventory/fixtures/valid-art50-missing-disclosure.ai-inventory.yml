# Fixture: the case this piece exists to catch. The scan found the generation call AND found that
# nothing marks the output, so the manifest records the gap rather than a label saying "Article 50
# applies". A missing disclosure is a finding, not a validation error: the validator must exit 0
# here and the gap must reach a human in Noru.
#
# Note `searched`. It is required whenever a disclosure is called absent, because a notice rendered
# by a design system, a CMS, a mobile client or another repository is invisible to a repository
# scan. Saying where the check looked is the difference between a gap and a wrong accusation.
