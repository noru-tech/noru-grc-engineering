# Fixture: the one category where the correct finding is "stop", not "document".
#
# Article 5 has applied since 2 February 2025 (Article 113(a)). It is a prohibition, so a finding
# here is not an item for a remediation backlog next to everything else: it says the practice has to
# stop while counsel looks at it. The manifest still validates - the finding is data, and it has to
# reach a human in Noru to be acted on - but the validator lifts it above everything else in its
# output rather than leaving it as one row among many.
