findings:
  prohibited_practices:
    - system: interview-affect
      practice: emotion_inference_workplace_or_education
      article: Article 5(1)(f)
      determination: indicated
      action: >
        Disable the affect scorer in every environment today and take legal advice before it runs
        again. Do not schedule this as remediation work: Article 5 is a prohibition, so there is no
        version of this that is documented into compliance.
      status: suggested
      refs:
        - services/screening/src/affect.ts:29
        - services/screening/src/affect.ts:58
      interpretation:
        owner: sam.okafor@example.com
        decided_at: 2026-08-20
        expires_at: 2026-09-20
        rationale: >
          The system infers an emotional state of a candidate from biometric input in a recruitment
          context, which is what Article 5(1)(f) describes. That a human reads the score does not
          change the analysis: the prohibition is on the inference, not on how the output is used.
          Suggested, not asserted - counsel decides - but it is raised as stop rather than as an
          item to work through.
    - system: interview-affect
