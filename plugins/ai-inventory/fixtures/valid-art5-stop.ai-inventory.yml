  transparency_obligations:
    - system: interview-affect
      trigger: emotion_recognition
      article: Article 50(3)
      required_action: inform_natural_person
      applies_to_role: deployer
      disclosure:
        state: absent
        gap: >
          Nothing in the scheduling or consent path tells the candidate that their recording is
          scored for affect. Article 50(3) requires the people exposed to an emotion recognition
          system to be informed of its operation. This does not cure the Article 5 finding above and
          must not be treated as the fix for it.
        searched:
          - services/screening/src/
          - services/scheduling/src/templates/
          - the whole repository, for candidate-facing notice and consent text
      status: suggested
      refs:
        - services/screening/src/affect.ts:29
      interpretation:
        owner: sam.okafor@example.com
        decided_at: 2026-08-20
        expires_at: 2027-02-20
        rationale: >
          Recorded because it is separately true and separately enforceable. Informing the candidate
          would not make a prohibited practice permitted, and the two findings are kept apart so
          nobody reads the disclosure gap as the whole problem.
