name: Noru GRC

"on":
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: clock
        shell: bash
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: noru-tech/noru-grc-engineering/actions/enforce@__NORU_ENFORCE_SHA__
        with:
          as-of: ${{ steps.clock.outputs.date }}
