name: scorecard

# OpenSSF Scorecard: supply-chain checks on this repository, published to scorecard.dev (the README
# badge) and uploaded to code scanning. `publish_results: true` makes scorecard.dev verify this
# workflow, which is why it stays in the shape the action documents: no top-level env or defaults,
# read-only at the top, and write access only on the one job, for exactly what it needs.

on:
  branch_protection_rule:
  schedule:
    # Weekly, Tuesday morning, off the hour.
    - cron: "17 5 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF result to code scanning.
      security-events: write
      # Sign the published result, so scorecard.dev can verify it came from this workflow.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run the analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: upload to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
