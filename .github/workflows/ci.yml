name: ci

# Everything this repository checks, in one workflow. There is deliberately no dependency install
# step anywhere below: collectors are Node built-ins only and validators are Python standard library
# only, so if CI ever needs `npm install` or `pip install`, something has broken the atomicity
# promise in CONTRIBUTING.md and this file should fail rather than paper over it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node --check every .mjs
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.mjs' -print | sort | while read -r f; do
            echo "checking $f"
            node --check "$f"
          done
      - name: python3 -m py_compile every .py
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.py' -print | sort | while read -r f; do
            echo "checking $f"
            python3 -m py_compile "$f"
          done
      - name: the generated templates must be syntactically valid too
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          for f in scripts/templates/*.mjs.tmpl; do
            out="$tmp/$(basename "${f%.tmpl}")"
            sed 's/__PIECE__/sample-piece/g' "$f" > "$out"
            node --check "$out"
          done
          for f in scripts/templates/*.py.tmpl; do
            out="$tmp/$(basename "${f%.tmpl}")"
            sed 's/__PIECE__/sample_piece/g' "$f" > "$out"
            python3 -m py_compile "$out"
          done
      - name: every JSON file parses
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -name '*.json' -print | sort | while read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

  repo:
    name: marketplace and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: marketplace manifests, schema sync, secret hygiene
        run: python3 scripts/check_repo.py
      - name: vendored libraries have not drifted
        run: python3 scripts/check_vendored_lib.py

  tests:
    name: tests (node ${{ matrix.node }}, python ${{ matrix.python }}, ${{ matrix.yaml }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what CONTRIBUTING.md promises: Node 18 for global fetch/FormData/Blob, and a
        # Python old enough that "it works on the machine in front of you" is a safe assumption.
        # The `yaml` dimension is not cosmetic. The validators ship a bundled fallback parser and
        # use PyYAML when it happens to be importable, so there are two loaders in production and a
        # manifest must validate identically under both. Testing only the clean interpreter hid a
        # bug where PyYAML resolved unquoted dates to datetime.date and every valid fixture failed
        # on any machine that had PyYAML installed.
        include:
          - node: "18"
            python: "3.9"
            yaml: "no pyyaml"
          - node: "20"
            python: "3.12"
            yaml: "no pyyaml"
          - node: "20"
            python: "3.12"
            yaml: "pyyaml"
          - node: "22"
            python: "3.13"
            yaml: "no pyyaml"
          - node: "22"
            python: "3.13"
            yaml: "pyyaml"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install PyYAML so the other loader is exercised
        if: matrix.yaml == 'pyyaml'
        run: python3 -m pip install --quiet pyyaml
      - name: confirm the intended loader is the one in use
        run: |
          python3 - <<'EOF'
          import importlib.util, os, sys
          have = importlib.util.find_spec("yaml") is not None
          want = os.environ["WANT"] == "pyyaml"
          if have != want:
              sys.exit(f"expected pyyaml={want}, found {have}")
          print("loader as expected: pyyaml" if have else "loader as expected: bundled fallback")
          EOF
        env:
          WANT: ${{ matrix.yaml }}
      - name: schema fixtures and validator unit tests
        run: python3 scripts/test_validators.py
      - name: a second push must be a no-op
        run: python3 scripts/test_idempotency.py
      - name: every plugin satisfies contract requirements 1-9
        run: python3 scripts/contract_test.py
      - name: CI mode fails on drift and on an expired interpretation
        run: python3 scripts/test_ci_mode.py

  scaffold:
    name: a scaffolded piece satisfies the contract
    runs-on: ubuntu-latest
    # If this fails, the contract has moved and the scaffolder has not. That is the moment to fix
    # the scaffolder, because every future piece starts from it.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: scaffold a throwaway piece
        run: node scripts/scaffold-piece.mjs ci-scaffold-probe
      - name: it must pass the contract test unmodified
        run: python3 scripts/contract_test.py --piece=ci-scaffold-probe
      - name: and its validator must pass its own fixtures
        run: python3 scripts/test_validators.py
      - name: and CI mode must be able to drive it with no changes to the orchestrator
        # scripts/ci_check.py reads plugins/<piece>/piece.json and nothing else. A tooling failure
        # exits 6 even in warn mode, so a clean 0 here means it really drove the piece.
        run: python3 scripts/ci_check.py --piece=ci-scaffold-probe --repo=tests/fixture-repo --mode=warn
      - name: clean up so nothing is committed by accident
        if: always()
        run: |
          rm -rf plugins/ci-scaffold-probe contract/ci-scaffold-probe.schema.json
          rm -f tests/fixture-repo/.noru/.cache/ci-scaffold-probe.*
          git checkout -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          git status --porcelain

  ci-mode:
    name: the CI-mode action, on this repository
    runs-on: ubuntu-latest
    # Dogfood. This action is what every consumer's compliance gate will run, so it runs here first,
    # on every pull request, against the fixture repository this repo already maintains. The dates
    # are pinned so these three assertions mean the same thing next year as they do today.
    env:
      NORU_CI_AS_OF: "2026-08-27"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: materialise a repository whose committed manifest matches it
        run: python3 scripts/test_ci_mode.py --emit-fixture="${{ runner.temp }}/dogfood"

      - name: gate mode passes when the record is true
        uses: ./.github/actions/noru-ci
        with:
          piece: ai-inventory
          repo: ${{ runner.temp }}/dogfood
          mode: gate
          as-of: ${{ env.NORU_CI_AS_OF }}

      - name: a pull request that adds a model provider without updating the inventory
        run: |
          set -euo pipefail
          cat > "${{ runner.temp }}/dogfood/src/summarize.ts" <<'TS'
          // Added by CI to prove the drift gate fires. Not real code; nothing here runs.
          import { generateText } from "ai"
          import { anthropic } from "@ai-sdk/anthropic"

          export async function summarize(text: string) {
            return generateText({ model: anthropic("claude-sonnet-4-5"), prompt: text })
          }
          TS

      - name: must fail the gate with the drift exit code
        id: drift
        continue-on-error: true
        uses: ./.github/actions/noru-ci
        with:
          piece: ai-inventory
          repo: ${{ runner.temp }}/dogfood
          mode: gate
          as-of: ${{ env.NORU_CI_AS_OF }}
          summary: "false"

      - name: warn-only mode reports the same finding and does not fail
        id: warn
        uses: ./.github/actions/noru-ci
        with:
          piece: ai-inventory
          repo: ${{ runner.temp }}/dogfood
          mode: warn
          as-of: ${{ env.NORU_CI_AS_OF }}
          summary: "false"

      - name: an interpretation that expired must fail the gate too
        id: expired
        continue-on-error: true
        run: |
          set -euo pipefail
          repo="${{ runner.temp }}/dogfood"
          rm -f "$repo/src/summarize.ts"
          sed -i 's/expires_at: 20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]/expires_at: 2020-01-01/' \
            "$repo/.noru/ai-inventory.yml"
          set +e
          python3 scripts/ci_check.py --piece=ai-inventory --repo="$repo" \
            --as-of="$NORU_CI_AS_OF" --output=text
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: the three assertions
        run: |
          set -euo pipefail
          fail=0
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1: expected '$3', got '$2'"
              fail=1
            else
              echo "ok: $1 == $3"
            fi
          }
          check "drift outcome"     "${{ steps.drift.outcome }}"            "failure"
          check "drift exit code"   "${{ steps.drift.outputs.exit-code }}"  "3"
          check "drift output flag" "${{ steps.drift.outputs.drift }}"      "true"
          check "warn exits 0"      "${{ steps.warn.outcome }}"             "success"
          check "warn still finds"  "${{ steps.warn.outputs.drift }}"       "true"
          check "warn status"       "${{ steps.warn.outputs.status }}"      "warn"
          check "expiry exit code"  "${{ steps.expired.outputs.exit-code }}" "4"
          exit "$fail"
